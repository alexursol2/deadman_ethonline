# Render blueprint — both services, one apply.
#
# Alex: this is the step that needs your account.
#   1. render.com -> New -> Blueprint -> pick alexursol2/deadman_ethonline
#   2. set the three secrets below (marked sync:false) in the dashboard
#   3. deploy. Two URLs come out: the API and the board.
#
# SELLER_PRIVATE_KEY must NOT be the operator key — the operator OWNS the
# escrow. See docs/deploy.md.
#
# Worth knowing about the free tier, because it happens to suit the demo: a free
# WEB SERVICE sleeps after 15 minutes of inactivity, but a free STATIC SITE never
# sleeps. So the board stays up while the server is down — which is exactly the
# thing the demo is trying to show.
#
# MEASURED, after ~10 hours of genuine zero traffic: the first request took
# 52,533 ms. Warm requests after it: 320, 336, 284 ms. Two earlier attempts read
# ~350 ms and were worthless — both were taken inside the 15-minute window.
#
# Two things follow. (1) healthCheckPath does NOT keep a free instance awake; it
# gates deploys, nothing more. (2) The wake does not eat the refund window: the
# deadline is computed as now+60 in the settlement path (server/src/index.ts),
# which runs after the instance is already up. A cold start delays the FIRST
# request by ~52s and shortens the hold by zero seconds.
#
# It is still a recording hazard — 52 seconds of apparent nothing looks exactly
# like the failure we claim to survive. Warm /health before filming.
services:
  # ── the x402 resource server ────────────────────────────────────────────
  - type: web
    name: deadman-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4021
      - key: HEDERA_TESTNET_RPC
        value: https://testnet.hashio.io/api
      - key: MIRROR_NODE_URL
        value: https://testnet.mirrornode.hedera.com
      - key: X402_FACILITATOR_URL
        value: https://api.testnet.blocky402.com
      - key: PRICE_TINYBAR
        value: "500000000"
      - key: HOLD_DEADLINE_SECONDS
        value: "60"
      - key: DEMO_DARK
        value: "0"
      - key: SELLER_CLAIM_DELAY_SECONDS
        value: "0"
      # ── set these in the dashboard, not here ──
      - key: ESCROW_ADDRESS
        sync: false
      - key: SELLER_PRIVATE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false

  # ── the live board ──────────────────────────────────────────────────────
  #
  # Static on purpose, and this is the single most important architectural
  # constraint on the page: it reads the Hedera mirror node directly from the
  # browser and never calls our backend. The demo is killing our own
  # infrastructure and watching the buyer get refunded anyway. A board that goes
  # down with the server would destroy its own evidence.
  #
  # No build step — one HTML file published as-is, so what a judge views is what
  # is in the repo.
  - type: web
    name: deadman-board
    runtime: static
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: false
    buildCommand: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
